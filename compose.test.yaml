# Isolated synthetic data only. Never attach the development/production volume.
name: claps-tests
services:
  db-test:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: claps_test
      POSTGRES_PASSWORD: claps_test_local_only
      POSTGRES_DB: claps_test
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U claps_test -d claps_test']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  test-db-data:
